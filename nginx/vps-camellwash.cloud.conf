server {
    listen 80;
    listen [::]:80;
    server_name camellwash.cloud www.camellwash.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/apps/camell-wash/nginx/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://camellwash.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.camellwash.cloud;
    ssl_certificate /etc/letsencrypt/live/camellwash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camellwash.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://camellwash.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name camellwash.cloud;
    ssl_certificate /etc/letsencrypt/live/camellwash.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camellwash.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 1m;
    access_log /var/log/nginx/camellwash.access.log;
    error_log /var/log/nginx/camellwash.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
